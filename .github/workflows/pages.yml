# Publica el borrador de Truly Nolen Chile (carpeta sitio/, armada con scripts/armar_sitio_chile.py) en GitHub Pages.
# docs/ son los documentos de trabajo, por eso Pages no sale de ahí.
name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['sitio/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
